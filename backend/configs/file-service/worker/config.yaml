metrics_server:
  port: ":8080"
shutdown:
  shutdown_timeout: 5
vault:
  path: "secret/data/file-service"
user_photos_s3:
  bucket: "user-photos"
  region: "us-east-1"
chat_files_s3:
  bucket: "chat-files"
  region: "us-east-1"
file_deletion_from_s3_worker:
  count: 5
  interval_ms: 1000
  retry_interval_ms: 300000
  batch_size: 100
not_in_use_file_deletion_worker:
  count: 5
  interval_ms: 10000
  batch_size: 1000
file_deletion_tasks_consumer:
  kafka_consumer:
    group_id: "file-service-consumer"
    topic: "file-deletion-tasks"
    batch_size: 1000
    batch_timeout_ms: 1000
    name: "file_deletion_tasks_consumer"
  count: 5
file_deletion_worker:
  count: 5
  interval_ms: 1000
  retry_interval_ms: 300000
  batch_size: 1000
